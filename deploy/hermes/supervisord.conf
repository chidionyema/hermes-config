; The Hermes process table, ported from twelve launchd jobs.
;
; SEVEN JOBS MOVE. They are the ones that must survive losing the laptop.
; FOUR DO NOT, and each for a stated reason:
;   keepawake        `caffeinate -dims` stops a Mac sleeping. A container does not sleep.
;                    It is deleted, not ported.
;   ngrok            A tunnel that exists to reach the laptop from outside. On Fly the
;                    app has a public address, so the tunnel is the thing being replaced.
;   runaway-reaper   Kills runaway processes on the laptop. It watches THAT machine.
;   idle-engine      Reads laptop idle time. There is no such thing here.
;   watchdog         Watches laptop launchd jobs. Supervisor is the watchdog here.

[program:coordinator]
command=/bin/bash /Users/chidionyema/.hermes/scripts/coordinator-daemon.sh daemon
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/data/logs/coordinator.log
stderr_logfile=/data/logs/coordinator.err
directory=/Users/chidionyema/.hermes

[program:cockpit]
command=/bin/bash /Users/chidionyema/.hermes/scripts/cockpit-daemon.sh
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/data/logs/cockpit.log
stderr_logfile=/data/logs/cockpit.err
directory=/Users/chidionyema/.hermes

[program:otto-server]
command=/bin/bash /Users/chidionyema/.hermes/scripts/otto-daemon.sh
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/data/logs/otto.log
stderr_logfile=/data/logs/otto.err
directory=/Users/chidionyema/.hermes

; HELD BACK ON PURPOSE. One bot token, one long poller. Start it only after the
; laptop's gateway is stopped:  supervisorctl start gateway
[program:gateway]
command=/opt/venv/bin/python -m hermes_cli.main gateway run --replace
autostart=false
autorestart=true
startsecs=10
stdout_logfile=/data/logs/gateway.log
stderr_logfile=/data/logs/gateway.err
directory=/Users/chidionyema/.hermes

[program:progress]
command=/usr/local/bin/periodic.sh 3600 /bin/bash /Users/chidionyema/.hermes/scripts/progress-snapshot.sh
autostart=true
autorestart=true
stdout_logfile=/data/logs/progress.log
stderr_logfile=/data/logs/progress.err
directory=/Users/chidionyema/.hermes

; No StartInterval on the laptop - it is triggered, not scheduled. Hourly here is a
; floor, not a schedule, and it is the one number in this file that is a choice rather
; than a measurement.
[program:rsi]
command=/usr/local/bin/periodic.sh 3600 /bin/bash /Users/chidionyema/.hermes/scripts/rsi-autorun.sh
autostart=true
autorestart=true
stdout_logfile=/data/logs/rsi.log
stderr_logfile=/data/logs/rsi.err
directory=/Users/chidionyema/.hermes

[program:submodule-backup]
command=/usr/local/bin/periodic.sh 86400 /bin/bash /Users/chidionyema/.hermes/recovery/backup-submodule.sh
autostart=true
autorestart=true
stdout_logfile=/data/logs/submodule-backup.log
stderr_logfile=/data/logs/submodule-backup.err
directory=/Users/chidionyema/.hermes
