# The Hermes gate.
#
# Until 2026-08-19 this repository had no .github/workflows directory at all. Nothing checked a
# Hermes change before it reached the machine that runs Hermes: commits were pushed by an
# auto-sync job and deployed by hand from a laptop working tree. That is the blind spot the
# founder named — Prospector cannot merge a red branch, and Hermes could not even be red.
#
# WHERE IT RUNS. `vars.CI_RUNS_ON`, the same switch Prospector uses (docs/CI_RUNNER.md in that
# repo). Hosted runner minutes are metered and billed, and billing has failed before and turned
# every job on every PR red with no logs. Self-hosted minutes are not metered, even on a private
# repo. Set the variable and jobs go to our own runners; unset it and they go back to GitHub's.
#
#   gh variable set CI_RUNS_ON --body self-hosted --repo chidionyema/hermes-config
#
# The runners themselves come from the Prospector repo's own tooling, which is already
# parameterised for exactly this:
#
#   PROSPECTOR_RUNNER_APP=hermes-ci GITHUB_REPO=chidionyema/hermes-config deploy/runners.sh up 1

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # hermes-agent is a PRIVATE submodule living in a DIFFERENT repository, so checkout's
      # `submodules: true` cannot fetch it whatever it is set to: GITHUB_TOKEN is scoped to this
      # repository alone. The first CI run here (32256112709) died on exactly that, one step later,
      # with "does not appear to be a Python project" for a directory that was simply empty.
      #
      # The credential is a READ-ONLY DEPLOY KEY on chidionyema/hermes-agent, held as the secret
      # HERMES_AGENT_DEPLOY_KEY. That is the narrowest thing that does the job: it reads one
      # repository and can write nothing. A personal access token would hand every job on every
      # pull request the founder's whole account, on a runner that executes branch code.
      - name: Fetch the pinned hermes-agent
        env:
          DEPLOY_KEY: ${{ secrets.HERMES_AGENT_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::HERMES_AGENT_DEPLOY_KEY is not set. Mint a read-only deploy key on" \
                 "chidionyema/hermes-agent and store its private half here:" \
                 "bash scripts/ci_mint_agent_deploy_key.sh"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/hermes_agent
          chmod 600 ~/.ssh/hermes_agent
          # THIS LINE ONCE READ `... >> ~/.ssh/known_hosts 2>/dev/null`, and that is the whole
          # story of run 32268561071: `Process completed with exit code 127`, 13 milliseconds in,
          # not one other line of output. 127 is "command not found". The runner image had no
          # openssh-client, and the shell said so on stderr, into the redirect.
          #
          # `run:` executes under `/usr/bin/bash -e`, so this command's exit status IS the step's
          # exit status. Silencing stderr on a command like that leaves the operator a bare number.
          # So: check the binary is here and name the fix, then let ssh-keyscan speak. It writes
          # two `# github.com:22 SSH-2.0-...` banner lines to stderr and those now reach the job
          # log. Two lines of noise is the price of a diagnosable failure, and it is cheap.
          command -v ssh-keyscan >/dev/null 2>&1 || {
            echo "ssh-keyscan is not on this runner. The image needs openssh-client:" >&2
            echo "  chidionyema/prospector -> deploy/runner/Dockerfile, then deploy/runners.sh up" >&2
            echo "  (check \`gh run list --status in_progress\` first: that deploy kills live jobs)" >&2
            exit 1
          }
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          # ssh-keyscan can exit 0 having found nothing — a network hiccup, a proxy. An empty
          # known_hosts then fails much further down as an unrelated-looking host key error.
          grep -q '^github.com ' ~/.ssh/known_hosts || {
            echo "ssh-keyscan returned no host key for github.com, so the submodule clone below" >&2
            echo "  would fail as a host-key error instead of as this." >&2
            exit 1
          }

          # .gitmodules names an https URL, which is what a human with `gh` logged in wants. A
          # deploy key only speaks SSH. The override is written to THIS repository's config after
          # `init` has copied the file's value in - never to --global, because a self-hosted runner
          # keeps its HOME between jobs and a global url rewrite would follow every later job on
          # the box into a repository it has no key for.
          git submodule init
          git config submodule.hermes-agent.url git@github.com:chidionyema/hermes-agent.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/hermes_agent -o IdentitiesOnly=yes" \
            git submodule update --recursive
          test -f hermes-agent/pyproject.toml

      # Same reason: HOME survives the job on a self-hosted runner, and the workspace wipe at the
      # bottom of the runner loop does not touch it. The key does not outlive the job that used it.
      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/hermes_agent

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The laptop venv is 3.11.15 and the container image is 3.11. Pinning here keeps the gate
      # measuring the same interpreter production runs, rather than whatever the runner ships.
      - name: Install the agent and its dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e ./hermes-agent

      # The whole gate, both kinds of test file. tests/run.sh exists because pytest IMPORTS
      # every file it collects, so collecting a script-style test ran it, and one failure there
      # aborted the session with `INTERNALERROR ... no tests ran`. Do not replace this with a
      # bare `pytest tests/`.
      - name: Hermes gate
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: bash tests/run.sh

      # These two need no network and no credentials, so they are also the canary: if the step
      # above starts failing for an environment reason, this one still says whether the fences
      # themselves are intact.
      - name: The single-environment fence, and the lease that decides it
        run: |
          bash scripts/test_verify_estate_single_environment.sh
          .venv/bin/python -m pytest tests/test_hermes_lease.py -q

      # A deploy reads these two files. A typo in either takes the whole container down at boot,
      # and the deploy that does it reports success. Parsing them costs a second.
      - name: Deploy files parse
        run: |
          .venv/bin/python -c "import configparser; c = configparser.ConfigParser(); \
            c.read('deploy/hermes/supervisord.conf'); \
            print('supervisord.conf:', len(c.sections()), 'sections')"
          .venv/bin/python -c "import tomllib; \
            d = tomllib.load(open('deploy/hermes/fly.toml','rb')); print('fly.toml:', d['app'])"
          bash -n deploy/hermes/entrypoint.sh
          bash -n deploy/hermes/deploy.sh
